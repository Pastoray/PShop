[package]
name = "order-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
lapin = "4.12.3"
prometheus = "0.14.0"
pshop-common = { version = "0.1.0", path = "../common" }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
