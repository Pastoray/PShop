[package]
name = "search-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
futures-util = "0.3.34"
prometheus = "0.14.0"
pshop-common = { version = "0.1.0", path = "../common" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
