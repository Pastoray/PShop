# Local stand-in for the Kubernetes Ingress Controller / L7 load balancer.
#
# In Kubernetes the same job is done by ingress-nginx (infra/k8s/ingress.yaml); this file
# exists so `docker compose up` exercises the same routing and balancing behaviour.

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_requests 100000;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # least_conn: with uneven request cost (Redis hiccup on one pod) it beats round-robin.
    upstream order_service {
        least_conn;
        server order-1:8080 max_fails=3 fail_timeout=5s;
        server order-2:8080 max_fails=3 fail_timeout=5s;
        server order-3:8080 max_fails=3 fail_timeout=5s;
        keepalive 256;
    }
    upstream search_service  { server search-sync:8080;     keepalive 32; }
    upstream billing_service { server billing-service:8080; keepalive 32; }
    upstream gateway_service { server metrics-gateway:8080; keepalive 8; }
    upstream dashboard       { server dashboard:3000;       keepalive 16; }

    server {
        listen 8081 reuseport;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;

        location = /v1/orders {
            limit_except POST { deny all; }
            proxy_connect_timeout 500ms;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            # Retry ONLY when the request provably never reached a pod (connect error / refused).
            # nginx will not replay a POST that was already sent. We also do not retry on 503:
            # the pod may have reserved stock, and replaying without an Idempotency-Key would
            # create a second order.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_pass http://order_service;
        }

        location /v1/search   { proxy_pass http://search_service; }
        location /v1/products { proxy_pass http://search_service; }

        # Read side of an order (status, invoice PDF). Billing owns Postgres and the invoice bucket.
        location /v1/order-status/ { proxy_pass http://billing_service; }
        location /v1/invoices/     { proxy_pass http://billing_service; }
        # Demo control plane (404 unless billing runs with CONTROL_ENABLED=true).
        location /v1/control/      { proxy_pass http://billing_service; }

        location = /api/snapshot { proxy_pass http://gateway_service; }

        location /ws {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://gateway_service;
        }

        location / { proxy_pass http://dashboard; }
    }

    # Internal only (not published): scraped by nginx-prometheus-exporter.
    server {
        listen 8082;
        location = /stub_status {
            stub_status;
        }
    }
}
