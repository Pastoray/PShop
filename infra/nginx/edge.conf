# Simulated Cloudflare edge (what sits in front of the "ingress controller").
#
# It reproduces the *behaviours* that matter for the architecture, not Cloudflare itself:
#   * a coarse per-IP rate limit (WAF / rate-limiting rule)
#   * CF-Connecting-IP / CF-Ray / CF-Cache-Status style headers
#   * micro-caching of safe GETs (search) with request coalescing (proxy_cache_lock)
#   * POST /v1/orders is NEVER cached and never retried
#
# The limit below is deliberately huge: the load generator is ONE source IP sending 5k+ rps.
# Lower it (e.g. rate=50r/s) to watch the edge shed abusive clients with 429 before they touch the origin.

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    # Per-request access logging at 5k rps becomes a bottleneck of its own.
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 100000;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=edge_ip:20m rate=20000r/s;
    limit_req_status 429;

    proxy_cache_path /tmp/edge-cache levels=1:2 keys_zone=edge_cache:10m max_size=64m inactive=30s use_temp_path=off;

    upstream ingress {
        server nginx-ingress:8081;
        keepalive 512;
    }

    server {
        listen 8080 reuseport;

        add_header Server "cloudflare" always;
        add_header CF-RAY "$request_id-ALG" always;
        add_header CF-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # edge is the trust boundary: overwrite, never append
        proxy_set_header X-Request-Id $request_id;

        location = /v1/orders {
            limit_req zone=edge_ip burst=10000 nodelay;
            client_max_body_size 4k;
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;           # a POST must never be silently replayed
            proxy_pass http://ingress;
        }

        location /v1/search {
            proxy_cache edge_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;               # N identical misses -> 1 origin request
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_pass http://ingress;
        }

        location /ws {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://ingress;
        }

        location / {
            proxy_pass http://ingress;
        }
    }
}
