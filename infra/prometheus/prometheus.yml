global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Rust services. Docker DNS resolves each replica name; `job` is what the dashboard groups by.
  - job_name: order-service
    static_configs:
      - targets: ["order-1:8080", "order-2:8080", "order-3:8080"]
  - job_name: billing-service
    static_configs:
      - targets: ["billing-service:8080"]
  - job_name: search-sync
    static_configs:
      - targets: ["search-sync:8080"]
  - job_name: metrics-gateway
    static_configs:
      - targets: ["metrics-gateway:8080"]

  # Infrastructure
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
