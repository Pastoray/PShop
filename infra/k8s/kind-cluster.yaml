kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pshop
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"   # required by the kind ingress-nginx manifest
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080          # http://localhost:8080 -> ingress-nginx
        protocol: TCP
  - role: worker
  - role: worker
