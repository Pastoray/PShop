# Per-queue series (payments.process depth, unacked, consumers) are what the dashboard and alerts need.
prometheus.return_per_object_metrics = true

# Broker-side memory/disk protection. When tripped, publishers are blocked (connection.blocked)
# instead of the node being OOM-killed.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Confirms are the contract with order-service; keep consumer timeout generous for slow payments.
consumer_timeout = 300000
