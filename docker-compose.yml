# PShop Engine — full local stack.
#
#   make up          build + start everything
#   make load        flood the edge with 5k req/s
#   open http://localhost:8080   (dashboard, through the simulated Cloudflare edge)
#   open http://localhost:3001   (Grafana, admin / $GRAFANA_PASSWORD)
#
# Rough footprint: ~6-8 GB RAM (Elasticsearch + Kafka + RabbitMQ dominate).
# Infra ports are bound to 127.0.0.1 only.

name: pshop

x-rust-env: &rust-env
  RUST_LOG: ${RUST_LOG:-info}
  # Everything AWS goes to LocalStack. Dummy creds are only for reaching it.
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  REDIS_URL: redis://redis:6379
  AMQP_URL: amqp://pshop:${RABBITMQ_PASSWORD:-pshop}@rabbitmq:5672/%2f
  KAFKA_BROKERS: kafka:9092
  ES_URL: http://elasticsearch:9200
  # Must be identical for every service that declares the queue (else PRECONDITION_FAILED).
  QUEUE_MAX_LEN: "500000"
  SEED_SKUS: "100"
  SEED_STOCK_PER_SKU: "1000000"

x-order-service: &order-service
  build:
    context: .
    dockerfile: docker/Dockerfile.rust
    args: { SERVICE: order-service }
  image: pshop/order-service:dev
  environment:
    <<: *rust-env
    MAX_INFLIGHT: "4096"
    REDIS_CONNECTIONS: "4"
    AMQP_CHANNELS: "8"
  depends_on:
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped
  stop_grace_period: 20s
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 256M }

services:
  # ───────────────────────────── edge ─────────────────────────────
  # Simulated Cloudflare: WAF-style rate limit, CF-* headers, micro-cache for GETs.
  nginx-edge:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/nginx.conf:ro
    depends_on: [nginx-ingress]
    restart: unless-stopped

  # Local Ingress Controller / L7 load balancer (least_conn across order replicas).
  nginx-ingress:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/ingress.conf:/etc/nginx/nginx.conf:ro
    depends_on: [order-1, order-2, order-3, billing-service, search-sync, metrics-gateway, dashboard]
    restart: unless-stopped

  # ─────────────────────────── services ───────────────────────────
  order-1: { <<: *order-service, hostname: order-1 }
  order-2: { <<: *order-service, hostname: order-2 }
  order-3: { <<: *order-service, hostname: order-3 }

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
      args: { SERVICE: billing-service }
    image: pshop/billing-service:dev
    environment:
      <<: *rust-env
      # Throttle: the spike is absorbed by RabbitMQ, Postgres only sees this rate.
      BILLING_MAX_RPS: "800"
      BILLING_PREFETCH: "128"
      BILLING_CONCURRENCY: "64"
      PG_POOL_SIZE: "16"
      PAYMENT_LATENCY_MS: "20"
      PAYMENT_FAILURE_RATE: "0.02"
      MAX_ATTEMPTS: "3"
      # Demo only: lets the storefront flip the simulated payment provider to slow / down.
      CONTROL_ENABLED: "true"
      SLOW_PAYMENT_MS: "250"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      terraform-init: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 384M }

  search-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
      args: { SERVICE: search-sync }
    image: pshop/search-sync:dev
    environment:
      <<: *rust-env
      RECONCILE_INTERVAL_SECS: "30"
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  metrics-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
      args: { SERVICE: metrics-gateway }
    image: pshop/metrics-gateway:dev
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PROM_URL: http://prometheus:9090
      POLL_MS: "1000"
      # Only needed when the dashboard runs on another origin (next dev on :3000).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on: [prometheus]
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/Dockerfile.dashboard
    image: pshop/dashboard:dev
    restart: unless-stopped

  # Traffic generator (run on demand): docker compose --profile load run --rm loadgen --rps 5000
  loadgen:
    profiles: ["load"]
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
      args: { SERVICE: loadgen }
    image: pshop/loadgen:dev
    command: ["--url", "http://nginx-edge:8080", "--rps", "5000", "--duration", "60", "--ramp", "10", "--slo-p99-ms", "5"]
    depends_on: [nginx-edge]

  # ─────────────────────────── data plane ─────────────────────────
  redis:
    image: redis:7-alpine
    # noeviction is non-negotiable: evicting a stock key would silently reset inventory.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pshop}
      POSTGRES_DB: pshop
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=on"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pshop -d pshop"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pshop
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pshop}
    ports:
      - "127.0.0.1:15672:15672" # management UI
      - "127.0.0.1:15692:15692" # prometheus
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are declared, not accidentally created
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    # 6 partitions => up to 6 parallel search-sync consumers; key = sku keeps per-SKU order.
    entrypoint: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pshop.orders.completed --partitions 6 --replication-factor 1"]
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Dev laptops often sit above the default disk watermark, which flips indices read-only.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  # ──────────────────────── mocked AWS + IaC ───────────────────────
  # NOTE: LocalStack ships the latest images behind an auth token (since 2026-03-23);
  # 4.12 is the last line before that change. To use a newer tag set LOCALSTACK_AUTH_TOKEN.
  localstack:
    image: localstack/localstack:${LOCALSTACK_TAG:-4.12}
    environment:
      SERVICES: s3,sqs,sns,secretsmanager
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: "0"
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"secretsmanager\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  terraform-init:
    image: hashicorp/terraform:1.9
    working_dir: /tf
    volumes: ["./infra/terraform/localstack:/tf"]
    environment:
      TF_VAR_localstack_endpoint: http://localstack:4566
      TF_VAR_pg_host: postgres
      TF_VAR_pg_password: ${POSTGRES_PASSWORD:-pshop}
      TF_VAR_invoice_signing_key: ${INVOICE_SIGNING_KEY:-dev-only-change-me}
      TF_IN_AUTOMATION: "1"
    entrypoint: ["/bin/sh", "-c", "terraform init -input=false && terraform apply -auto-approve -input=false"]
    depends_on:
      localstack: { condition: service_healthy }
    restart: "no"

  # ─────────────────────────── observability ───────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pshop.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment: { REDIS_ADDR: redis://redis:6379 }
    depends_on: [redis]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://pshop:${POSTGRES_PASSWORD:-pshop}@postgres:5432/pshop?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx-ingress:8082/stub_status"]
    depends_on: [nginx-ingress]

volumes:
  redisdata:
  pgdata:
  rmqdata:
  kafkadata:
  esdata:
  promdata:
  grafanadata:
